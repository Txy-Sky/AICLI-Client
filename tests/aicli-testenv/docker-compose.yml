services:
  new-api:
    image: calciumion/new-api@sha256:d9956dc8bde83cb1378932802670350b3c4c1ee7611d2e0d7c63af111da2b989
    command: --log-dir /app/logs
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      - new_api_data:/data
      - new_api_logs:/app/logs
    environment:
      SQL_DSN: root:aicli_mysql@tcp(mysql:3306)/new-api?parseTime=true
      REDIS_CONN_STRING: redis://redis:6379
      TZ: UTC
      BATCH_UPDATE_ENABLED: "true"
      SESSION_COOKIE_SECURE: "false"
      GENERATE_DEFAULT_TOKEN: "false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      mock-upstream:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -q '\"success\":true'"]
      interval: 5s
      timeout: 5s
      retries: 30

  mysql:
    image: mysql:5.7.44
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: aicli_mysql
      MYSQL_DATABASE: new-api
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -paicli_mysql --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine

  mock-upstream:
    image: python:3.12-alpine
    command: ["python", "-m", "http.server", "8080", "--bind", "0.0.0.0"]

volumes:
  new_api_data:
  new_api_logs:
  mysql_data:
