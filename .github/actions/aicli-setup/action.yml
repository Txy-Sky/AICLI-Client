name: AICLI acceptance environment
description: Install the checklist toolchain on a disposable GitHub-hosted Linux runner.

inputs:
  rust-cache-key:
    description: Per-job Rust cache key; parallel jobs build different feature sets.
    required: false
    default: aicli-acceptance

runs:
  using: composite
  steps:
    - name: Isolate application and test configuration
      shell: bash
      run: |
        set -euo pipefail
        test_home="$RUNNER_TEMP/aicli-test-home"
        mkdir -p "$test_home"
        {
          echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}"
          echo "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}"
          echo "HOME=$test_home"
          echo "CC_SWITCH_TEST_HOME=$test_home"
          echo "XDG_CONFIG_HOME=$test_home/.config"
          echo "XDG_DATA_HOME=$test_home/.local/share"
          echo "XDG_CACHE_HOME=$test_home/.cache"
          # Keep line information without duplicating full debug data into every
          # test/example executable on the space-limited hosted runner.
          echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only"
          echo "CARGO_PROFILE_TEST_DEBUG=line-tables-only"
        } >> "$GITHUB_ENV"

    - name: Set up the pinned pnpm version
      shell: bash
      run: |
        set -euo pipefail
        package_manager=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).packageManager')
        npm install --global --ignore-scripts "$package_manager"

    - name: Set up the pinned Node.js version
      uses: actions/setup-node@v6
      with:
        node-version-file: .node-version
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Set up Go for the development comparison tools
      uses: actions/setup-go@v6
      with:
        go-version: "1.25.x"
        cache: false

    - name: Read the pinned Rust version
      id: rust-version
      shell: bash
      run: |
        set -euo pipefail
        channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
        test -n "$channel"
        echo "channel=$channel" >> "$GITHUB_OUTPUT"

    - name: Set up Rust, rustfmt, and Clippy
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        toolchain: ${{ steps.rust-version.outputs.channel }}
        components: rustfmt, clippy

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: src-tauri -> target
        shared-key: ${{ inputs.rust-cache-key }}

    - name: Install cargo-nextest
      uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
      with:
        tool: cargo-nextest

    - name: Install Linux build dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config libssl-dev \
          libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
          libwebkit2gtk-4.1-dev libsoup-3.0-dev
