  acceptance:
    name: Checklist acceptance (Linux)
    if: always() && github.ref == 'refs/heads/feat/aicli-client-v1'
    needs: [items, baseline, desktop, testenv]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every acceptance job to succeed
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RESULTS"
          python3 -c 'import json, os, sys; r = {k: v["result"] for k, v in json.loads(os.environ["RESULTS"]).items()}; print(r); sys.exit(0 if r and all(v == "success" for v in r.values()) else 1)'
