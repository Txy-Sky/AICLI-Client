name: AICLI Acceptance

on:
  push:
    branches: [feat/aicli-client-v1]
    paths-ignore:
      - "docs/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: aicli-acceptance-${{ github.ref }}
  cancel-in-progress: true

# Four parallel jobs (CI-OPT2). Item unit tests live in scripts/aicli-item-tests.sh
# so adding a checklist item does not edit this file (which forces full A6 coverage).
jobs:
  items:
    name: Rust item tests (Linux)
    if: github.ref == 'refs/heads/feat/aicli-client-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact acceptance revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up the isolated acceptance environment
        uses: ./.github/actions/aicli-setup
        with:
          rust-cache-key: aicli-items
      - name: Prepare the evidence directory
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/aicli-evidence"
      - name: A2-01 verify all toolchains and Linux dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aicli-evidence"
          {
            printf 'Revision: %s\n' "$GITHUB_SHA"
            printf 'Runner: %s / %s\n' "$RUNNER_OS" "$RUNNER_ARCH"
            test "$HOME" = "$CC_SWITCH_TEST_HOME"
            test "$HOME" = "$RUNNER_TEMP/aicli-test-home"
            node -v
            test "$(node -v)" = "v$(tr -d '\r\n' < .node-version)"
            pnpm --version
            test "pnpm@$(pnpm --version)" = "$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).packageManager')"
            rustc -V
            rustc -V | grep -E '^rustc 1\.95\.'
            cargo fmt --version
            cargo clippy --version
            cargo nextest --version
            docker --version
            docker compose version
            docker info --format '{{.ServerVersion}}'
            go version
            python3 --version
            python3 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
            python3 -c 'import subprocess; version = subprocess.check_output(["go", "env", "GOVERSION"], text=True).strip().removeprefix("go"); assert tuple(map(int, version.split(".")[:2])) >= (1, 25)'
            pkg-config --modversion openssl gtk+-3.0 librsvg-2.0 ayatana-appindicator3-0.1 webkit2gtk-4.1 libsoup-3.0
            df -h "$GITHUB_WORKSPACE" "$HOME"
            printf 'A2-01: PASS\n'
          } 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/A2-01.txt"
      - name: Rust item tests without extra features (C1-01..C1-08)
        shell: bash
        run: bash scripts/aicli-item-tests.sh default "$RUNNER_TEMP/aicli-evidence"
      - name: Rust item tests with test-hooks (C1-04, C1-06)
        shell: bash
        run: bash scripts/aicli-item-tests.sh test-hooks "$RUNNER_TEMP/aicli-evidence"
      - name: E-GATE real Claude Code privacy round
        shell: bash
        env:
          EGATE_EVIDENCE_DIR: ${{ runner.temp }}/aicli-evidence
        run: |
          set -euo pipefail
          # Real Claude Code CLI against the local proxy + capture upstream; no
          # Anthropic endpoint is contacted (ANTHROPIC_BASE_URL is the proxy).
          npm install -g @anthropic-ai/claude-code@2.1.293
          claude --version
          bash scripts/aicli-egate-privacy.sh 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/E-GATE-privacy.txt"
      - name: Save acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aicli-evidence-items-${{ github.sha }}
          path: ${{ runner.temp }}/aicli-evidence/
          if-no-files-found: warn
          retention-days: 7

  baseline:
    name: A3-01 baseline (Linux)
    if: github.ref == 'refs/heads/feat/aicli-client-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact acceptance revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up the isolated acceptance environment
        uses: ./.github/actions/aicli-setup
        with:
          rust-cache-key: aicli-baseline
      - name: Prepare the evidence directory
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/aicli-evidence"
      - name: Fail fast on formatting and types
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aicli-evidence"
          {
            cargo fmt --check --manifest-path src-tauri/Cargo.toml
            pnpm install --frozen-lockfile
            pnpm format:check
            pnpm typecheck
            python3 -m pip install --user PyYAML==6.0.3
            python3 scripts/aicli-check-workflow-yaml.py
            python3 -m unittest discover -s scripts/tests -p test_aicli_ci_scope.py -v
          } 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/CI-OPT-fast.txt"
      - name: A3-01 run the baseline acceptance commands
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/aicli-check.sh 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/A3-01.txt"
      - name: Save acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aicli-evidence-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/aicli-evidence/
          if-no-files-found: warn
          retention-days: 7

  desktop:
    name: B stage desktop checks (Linux)
    if: github.ref == 'refs/heads/feat/aicli-client-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact acceptance revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up the isolated acceptance environment
        uses: ./.github/actions/aicli-setup
        with:
          rust-cache-key: aicli-desktop
      - name: Prepare the evidence directory
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/aicli-evidence"
      - name: Install locked frontend dependencies
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: B-01 verify the configuration directory identity
        shell: bash
        run: |
          set -euo pipefail
          if grep -rn '"\.cc-switch"' src-tauri/src; then
            echo 'B-01: legacy configuration directory literal remains'
            exit 1
          fi
          cargo nextest run --manifest-path src-tauri/Cargo.toml --test config_identity 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/B-01.txt"
      - name: B-02 verify the proxy port migration
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/aicli-check-legacy-port.py
          test "$(grep -R -n -o '15821' src-tauri/src src | wc -l)" -gt 0
          cargo nextest run --manifest-path src-tauri/Cargo.toml claude_desktop_aicli_write_and_cleanup_preserve_legacy_profile 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/B-02-desktop.txt"
          printf 'B-02: PASS\n' | tee "$RUNNER_TEMP/aicli-evidence/B-02.txt"
      - name: B-06 verify Codex identity and startup history preservation
        shell: bash
        run: |
          set -euo pipefail
          cargo nextest run --manifest-path src-tauri/Cargo.toml codex 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/B-06-codex.txt"
          cargo nextest run --manifest-path src-tauri/Cargo.toml codex_startup_migrations_preserve_existing_history_bytes 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/B-06-startup.txt"
          printf 'B-06: PASS\n' | tee "$RUNNER_TEMP/aicli-evidence/B-06.txt"
      - name: B-04 verify deep links and generated Linux handler
        shell: bash
        run: |
          set -euo pipefail
          cargo nextest run --manifest-path src-tauri/Cargo.toml deeplink 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/B-04-tests.txt"
          sudo apt-get install -y --no-install-recommends xvfb xauth xdg-utils desktop-file-utils
          cargo build --manifest-path src-tauri/Cargo.toml --example aicli-deeplink-probe
          mkdir -p "$RUNNER_TEMP/aicli-deeplink-probe"
          cp src-tauri/target/debug/examples/aicli-deeplink-probe "$RUNNER_TEMP/aicli-deeplink-probe/aicli-client"
          xvfb-run -a "$RUNNER_TEMP/aicli-deeplink-probe/aicli-client" 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/B-04-handler.txt"
          printf 'B-04: PASS\n' | tee "$RUNNER_TEMP/aicli-evidence/B-04.txt"
      - name: B-03 verify product identity metadata
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path src-tauri/Cargo.toml 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/B-03-cargo.txt"
          pnpm typecheck 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/B-03-typecheck.txt"
          scan_status=0
          grep -n -E 'ccswitch|CC Switch' src-tauri/tauri.conf.json src-tauri/Cargo.toml package.json > "$RUNNER_TEMP/aicli-evidence/B-03-scan.txt" || scan_status=$?
          cat "$RUNNER_TEMP/aicli-evidence/B-03-scan.txt"
          test "$scan_status" -eq 1
          test ! -s "$RUNNER_TEMP/aicli-evidence/B-03-scan.txt"
          test "$(grep -n 'AICLI Client' src-tauri/tauri.conf.json src-tauri/tauri.windows.conf.json | wc -l)" -gt 0
          test "$(grep -n 'com.aicliapi.com' src-tauri/tauri.conf.json | wc -l)" -gt 0
          test "$(grep -n '0.1.0' src-tauri/tauri.conf.json src-tauri/Cargo.toml package.json | wc -l)" -ge 3
          printf 'B-03: PASS\n' | tee "$RUNNER_TEMP/aicli-evidence/B-03.txt"
      - name: B-05 verify updater disabled and release workflow guards
        shell: bash
        run: |
          set -euo pipefail
          legacy_pattern=$(printf '%s%s\\|%s%s' 'farion' '1231' 'ccswitch' '.io')
          scan_status=0
          grep -n "$legacy_pattern" src-tauri/tauri.conf.json .github/workflows/* > "$RUNNER_TEMP/aicli-evidence/B-05-scan.txt" || scan_status=$?
          cat "$RUNNER_TEMP/aicli-evidence/B-05-scan.txt"
          test "$scan_status" -eq 1
          test ! -s "$RUNNER_TEMP/aicli-evidence/B-05-scan.txt"
          python3 -m pip install --user pyyaml
          python3 - <<'PY' | tee "$RUNNER_TEMP/aicli-evidence/B-05.txt"
          import json
          from pathlib import Path
          import yaml

          config = json.loads(Path("src-tauri/tauri.conf.json").read_text())
          assert config["bundle"]["createUpdaterArtifacts"] is False
          assert config["plugins"]["updater"] == {"pubkey": "", "endpoints": []}
          for name in ("schema-version", "sync-r2", "stale", "labeler", "claude", "wsl2-nightly"):
              assert not Path(f".github/workflows/{name}.yml").exists()
          release = Path(".github/workflows/release.yml").read_text()
          assert "cc-switch" not in release and "CC-Switch" not in release
          workflow = yaml.safe_load(release)
          guarded = {"Prepare Tauri signing key", "Import Apple signing certificate",
                     "Bundle, sign and notarize (macOS)", "Prepare macOS Assets",
                     "Notarize macOS DMG", "Verify macOS code signing and notarization",
                     "Clean up Apple signing keychain"}
          seen = set()
          for job in workflow["jobs"].values():
              for step in job.get("steps", []):
                  if step.get("name") in guarded:
                      assert "vars.AICLI_RELEASE_SIGNING == 'true'" in step.get("if", ""), step["name"]
                      seen.add(step["name"])
          assert seen == guarded
          print("B-05: PASS; updater disabled; both legacy scans empty; release signing guarded; release not executed")
          PY
      - name: B-07 verify visible copy and upstream attribution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "$RUNNER_TEMP/aicli-evidence/B-07.txt"
          import json
          from pathlib import Path
          import re
          import subprocess

          baseline = "d82605fd66a1f9c064daa000a5652351d9773aac"
          files = sorted(Path("src/i18n/locales").glob("*.json"))
          assert len(files) == 5

          # G-01 (owner 2026-11-09): namespaces owned only by the removed provider UI
          # (forms, presets incl. providerForm.partnerPromotion, usage scripts, mode
          # and failover panels) go away with it. Nothing else may be removed.
          removed_namespaces = {
              "providerForm", "providerPreset", "presetSelector", "providerCard",
              "providerIcon", "iconPicker", "universalProvider", "usageScript",
              "endpointTest", "apiKeyInput", "claudeConfig", "codexConfig",
              "geminiConfig", "opencode", "omo", "grokBuild", "claudeCode", "codex",
              "claudeDesktop", "mcode", "mode", "failover", "streamCheck",
              "proxyConfig", "health", "openclawConfig", "deeplink", "console",
              "appSwitcher",
              # G-02: official-account frontend (quota footers, auth center)
              "copilot", "codexOauth", "xaiOauth", "managedAuth", "authCenter",
              "subscription", "quota",
          }
          # G-02: nested keys of the removed auth center / Copilot hints
          removed_keys = {
              ("settings", "authCenter"),
              ("notifications", "proxyReasonCopilot"),
              ("notifications", "copilotProxyHint"),
              # G-04 (owner 2026-11-10): WebDAV / S3 cloud sync removed (syncs the
              # credential database off-device); tray panel rewritten to native menu
              ("settings", "webdavSync"),
              ("settings", "s3Sync"),
              ("settings", "syncType"),
              ("confirm", "autoSync"),
          }
          removed_keys = removed_keys | {
              ("settings", "advanced", "cloudSync"),
              ("settings", "general", "trayStyle"),
              ("settings", "general", "trayStylePanel"),
              ("settings", "general", "trayStyleMenu"),
              ("settings", "general", "trayStyleHelp"),
          }

          def compare(old, new, path=()):
              assert type(old) is type(new)
              if isinstance(old, dict):
                  # Every rebrand-baseline key must survive with its interpolations;
                  # later stages may add keys (F: all new copy goes into five locales).
                  kept = {
                      key for key in old
                      if not (not path and key in removed_namespaces)
                      and path + (key,) not in removed_keys
                  }
                  assert kept <= new.keys(), "translation keys removed"
                  for key in kept:
                      compare(old[key], new[key], path + (key,))
              elif isinstance(old, str):
                  assert sorted(re.findall(r"\{\{.*?\}\}", old)) == sorted(re.findall(r"\{\{.*?\}\}", new))

          legacy = re.compile(r"cc switch|cc-switch", re.IGNORECASE)
          for path in files:
              before = json.loads(subprocess.check_output(["git", "show", f"{baseline}:{path}"], text=True))
              after = json.loads(path.read_text())
              compare(before, after)
              gone = sorted(removed_namespaces & after.keys())
              gone += [".".join(key) for key in sorted(removed_keys) if key[1] in after.get(key[0], {})]
              assert not gone, (path.stem, gone)
              # G-01 restores the full scan: no legacy brand anywhere, promotions included
              assert not legacy.search(json.dumps(after, ensure_ascii=False)), path
              print(f"{path.stem}: removed namespaces={len(removed_namespaces)} keys={len(removed_keys)}; legacy brand hits=0")
              assert after["app"]["title"] == "AICLI Client"
          original_license = subprocess.check_output(["git", "show", f"{baseline}:LICENSE"])
          license_text = Path("LICENSE").read_bytes()
          assert license_text.startswith(original_license), "original MIT text must remain intact"
          assert b"Copyright (c) 2025 Jason Young" in license_text
          assert b"Copyright (c) 2026 Txy-Sky (AICLI Client modifications)" in license_text
          for name in ("README_DE.md", "README_JA.md", "README_ZH.md", "deplink.html"):
              assert not Path(name).exists(), name
          attribution = "基于 farion" + "1231/cc-switch，MIT"
          assert attribution in Path("README.md").read_text()
          assert len(Path("README.md").read_text().splitlines()) < 70
          for name in ("CONTRIBUTING.md", "SUPPORT.md", "SECURITY.md", "session-manager.md", "CHANGELOG.md"):
              assert Path(name).is_file(), name
          print("B-07: PASS; five locales retain all keys/interpolations outside the G-01/G-02 removed namespaces and keys; no legacy brand; original MIT bytes retained; project attribution added; concise docs and legacy README removal verified")
          PY
      - name: B-08 verify generated placeholder icons and debug build
        shell: bash
        run: |
          set -euo pipefail
          {
            python3 scripts/aicli-placeholder-icon.py
            pnpm tauri icon scripts/assets/aicli-placeholder.png --output src-tauri/icons
            python3 scripts/aicli-placeholder-icon.py --normalize-icns
            git diff --exit-code -- src-tauri/icons scripts/assets/aicli-placeholder.png
            pnpm tauri build --debug --no-bundle
            test -x src-tauri/target/debug/aicli-client
            python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("src-tauri/tauri.conf.json").read_text())
          for name in config["bundle"]["icon"]:
              path = Path("src-tauri") / name
              assert path.is_file() and path.stat().st_size > 0, path
          assert Path("scripts/assets/aicli-placeholder.png").is_file()
          print("B-08: PASS; generated icons reproducible; debug executable and all configured icons exist")
          PY
          } 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/B-08.txt"
      - name: B-GATE real desktop startup and loopback proxy
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends xvfb xauth xdg-utils desktop-file-utils
          python3 scripts/aicli-b-gate.py 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/B-GATE.txt"
          git diff --exit-code -- src/index.html
          test ! -e src/aicli-b-gate-probe.js
      - name: Save acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aicli-evidence-desktop-${{ github.sha }}
          path: ${{ runner.temp }}/aicli-evidence/
          if-no-files-found: warn
          retention-days: 7

  testenv:
    name: A6 test environment (Linux)
    if: github.ref == 'refs/heads/feat/aicli-client-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact acceptance revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up the isolated acceptance environment
        uses: ./.github/actions/aicli-setup
        with:
          rust-cache-key: aicli-testenv
      - name: Prepare the evidence directory
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/aicli-evidence"
      - name: Select the required test environment coverage
        id: coverage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Compare with the last successful *other* run, not a possibly cancelled push.
          # A rerun must retain the same coverage as its first attempt.
          if ! baseline=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/aicli-acceptance.yml/runs" \
            -f branch="$GITHUB_REF_NAME" -f status=success -f per_page=100 \
            --jq '.workflow_runs | map(select(.id != (env.GITHUB_RUN_ID | tonumber))) | .[0].head_sha // ""'); then
            baseline=""
          fi
          python3 scripts/aicli-ci-scope.py --base "$baseline" --head "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT" | tee "$RUNNER_TEMP/aicli-evidence/CI-OPT-coverage.txt"
      - name: Install Python test tools
        shell: bash
        run: python3 -m pip install --user pytest PyYAML==6.0.3
      - name: A5-01 offline probe safety and timing tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/aicli-poc -p 'test_line_probe.py' -v 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/A5-01-offline.txt"
      - name: A5-02 offline account probe safety tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/aicli-poc -p 'test_account_probe.py' -v 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/A5-02-offline.txt"
      - name: Build the test-hooks probes used by A6 integration tests
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path src-tauri/Cargo.toml --features test-hooks \
            --example aicli-newapi-probe --example aicli-cache-probe --example aicli-catalog-probe \
            2>&1 | tee "$RUNNER_TEMP/aicli-evidence/probes-build.txt"
      - name: A6-01 compose rc.34 environment and idempotent seed
        if: steps.coverage.outputs.testenv == 'true'
        shell: bash
        run: |
          set -euo pipefail
          project="aicli-a6-${GITHUB_RUN_ID}"
          docker compose -p "$project" -f tests/aicli-testenv/docker-compose.yml up -d
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:13000/api/status > "$RUNNER_TEMP/aicli-status.json.tmp"; then
              mv "$RUNNER_TEMP/aicli-status.json.tmp" "$RUNNER_TEMP/aicli-status.json"
              break
            fi
            sleep 2
          done
          AICLI_STATUS_FILE="$RUNNER_TEMP/aicli-status.json" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          status = json.loads(Path(os.environ["AICLI_STATUS_FILE"]).read_text())
          assert status.get("success") is True, status
          assert status.get("data", {}).get("version") == "v1.0.0-rc.34", status
          PY
          AICLI_TESTENV_BASE_URL=http://127.0.0.1:13000 \
            AICLI_TESTENV_ADMIN_USERNAME=admin \
            AICLI_TESTENV_ADMIN_PASSWORD=ChangeMe_for_local_tests_123\! \
            AICLI_TESTENV_ALICE_PASSWORD=ChangeMe_for_local_tests_123\! \
            python3 tests/aicli-testenv/seed.py
          AICLI_TESTENV_BASE_URL=http://127.0.0.1:13000 \
            AICLI_TESTENV_ADMIN_USERNAME=admin \
            AICLI_TESTENV_ADMIN_PASSWORD=ChangeMe_for_local_tests_123\! \
            AICLI_TESTENV_ALICE_PASSWORD=ChangeMe_for_local_tests_123\! \
            python3 tests/aicli-testenv/seed.py
          printf 'A6-01: PASS\n' | tee "$RUNNER_TEMP/aicli-evidence/A6-01.txt"
      - name: A6-01 sanitized startup logs and container start times
        if: always() && steps.coverage.outputs.testenv == 'true'
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          compose = ["docker", "compose", "-p", "aicli-a6-" + os.environ["GITHUB_RUN_ID"],
                     "-f", "tests/aicli-testenv/docker-compose.yml"]

          def redact(text):
              text = re.sub(r"(?i)\bsk-[^\s\"'<>;,]+", "[REDACTED]", text)
              text = re.sub(r"(?i)\bBearer\s+[^\s\"'<>;,]+", "[REDACTED]", text)
              text = re.sub(
                  r"(?i)([\"']?(?:access[_-]?token|refresh[_-]?token|proof[_-]?token|"
                  r"authorization|password|api[_-]?key|secret|token|key)[\"']?\s*[:=]\s*)"
                  r"(?:\"[^\"]*\"|'[^']*'|[^\s,;}]+)",
                  r"\1[REDACTED]", text,
              )
              # Also hide unlabelled opaque credentials; startup timestamps and
              # readiness messages remain readable. Raw output never hits disk.
              return re.sub(r"[A-Za-z0-9_+/=-]{20,}", "[REDACTED]", text)

          canary = "opaque" * 6
          for sample in ("sk-" + canary, "Bearer " + canary,
                         '"access_token":"' + canary + '"'):
              assert canary not in redact(sample), "startup log redaction failed"

          def capture(command):
              return subprocess.run(command, stdout=subprocess.PIPE,
                                    stderr=subprocess.STDOUT, text=True)

          logs = capture(compose + ["logs", "--timestamps", "mysql", "new-api"])
          print(redact(logs.stdout), flush=True)
          print("A6-01 startup connection_refused_count=" +
                str(logs.stdout.lower().count("connection refused")), flush=True)
          results = [logs.returncode]
          for service in ("mysql", "new-api"):
              containers = capture(compose + ["ps", "--all", "--quiet", service])
              results.append(containers.returncode)
              ids = containers.stdout.split()
              if containers.returncode != 0 or not ids:
                  print("A6-01 StartedAt unavailable for " + service, flush=True)
                  results.append(1)
                  continue
              inspected = capture(["docker", "inspect", "--format",
                                   "{{.State.StartedAt}}", *ids])
              print("A6-01 " + service + " StartedAt=" + redact(inspected.stdout.strip()), flush=True)
              results.append(inspected.returncode)
          raise SystemExit(1 if any(results) else 0)
