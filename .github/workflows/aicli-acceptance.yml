name: AICLI Acceptance

on:
  push:
    branches: [feat/aicli-client-v1]
    paths-ignore:
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: aicli-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acceptance:
    name: Checklist acceptance (Linux)
    if: github.ref == 'refs/heads/feat/aicli-client-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact acceptance revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up the isolated acceptance environment
        uses: ./.github/actions/aicli-setup

      - name: A2-01 verify all toolchains and Linux dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aicli-evidence"
          {
            printf 'Revision: %s\n' "$GITHUB_SHA"
            printf 'Runner: %s / %s\n' "$RUNNER_OS" "$RUNNER_ARCH"
            test "$HOME" = "$CC_SWITCH_TEST_HOME"
            test "$HOME" = "$RUNNER_TEMP/aicli-test-home"
            node -v
            test "$(node -v)" = "v$(tr -d '\r\n' < .node-version)"
            pnpm --version
            test "pnpm@$(pnpm --version)" = "$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).packageManager')"
            rustc -V
            rustc -V | grep -E '^rustc 1\.95\.'
            cargo fmt --version
            cargo clippy --version
            cargo nextest --version
            docker --version
            docker compose version
            docker info --format '{{.ServerVersion}}'
            go version
            python3 --version
            python3 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
            python3 -c 'import subprocess; version = subprocess.check_output(["go", "env", "GOVERSION"], text=True).strip().removeprefix("go"); assert tuple(map(int, version.split(".")[:2])) >= (1, 25)'
            pkg-config --modversion openssl gtk+-3.0 librsvg-2.0 ayatana-appindicator3-0.1 webkit2gtk-4.1 libsoup-3.0
            df -h "$GITHUB_WORKSPACE" "$HOME"
            printf 'A2-01: PASS\n'
          } 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/A2-01.txt"

      - name: A5-01 offline probe safety and timing tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/aicli-poc -p 'test_line_probe.py' -v 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/A5-01-offline.txt"

      - name: A5-02 offline account probe safety tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/aicli-poc -p 'test_account_probe.py' -v 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/A5-02-offline.txt"

      - name: A3-01 run the baseline acceptance commands
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/aicli-check.sh 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/A3-01.txt"

      - name: Save acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aicli-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/aicli-evidence/
          if-no-files-found: warn
          retention-days: 7
