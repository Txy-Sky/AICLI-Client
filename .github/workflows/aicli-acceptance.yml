name: AICLI Acceptance

on:
  push:
    branches: [feat/aicli-client-v1]
    paths-ignore:
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: aicli-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acceptance:
    name: Checklist acceptance (Linux)
    if: github.ref == 'refs/heads/feat/aicli-client-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact acceptance revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up the isolated acceptance environment
        uses: ./.github/actions/aicli-setup

      - name: A2-01 verify all toolchains and Linux dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aicli-evidence"
          {
            printf 'Revision: %s\n' "$GITHUB_SHA"
            printf 'Runner: %s / %s\n' "$RUNNER_OS" "$RUNNER_ARCH"
            test "$HOME" = "$CC_SWITCH_TEST_HOME"
            test "$HOME" = "$RUNNER_TEMP/aicli-test-home"
            node -v
            test "$(node -v)" = "v$(tr -d '\r\n' < .node-version)"
            pnpm --version
            test "pnpm@$(pnpm --version)" = "$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).packageManager')"
            rustc -V
            rustc -V | grep -E '^rustc 1\.95\.'
            cargo fmt --version
            cargo clippy --version
            cargo nextest --version
            docker --version
            docker compose version
            docker info --format '{{.ServerVersion}}'
            go version
            python3 --version
            python3 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
            python3 -c 'import subprocess; version = subprocess.check_output(["go", "env", "GOVERSION"], text=True).strip().removeprefix("go"); assert tuple(map(int, version.split(".")[:2])) >= (1, 25)'
            pkg-config --modversion openssl gtk+-3.0 librsvg-2.0 ayatana-appindicator3-0.1 webkit2gtk-4.1 libsoup-3.0
            df -h "$GITHUB_WORKSPACE" "$HOME"
            printf 'A2-01: PASS\n'
          } 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/A2-01.txt"

      - name: A5-01 offline probe safety and timing tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/aicli-poc -p 'test_line_probe.py' -v 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/A5-01-offline.txt"

      - name: A5-02 offline account probe safety tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/aicli-poc -p 'test_account_probe.py' -v 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/A5-02-offline.txt"

      - name: A6-01 compose rc.34 environment and idempotent seed
        shell: bash
        run: |
          set -euo pipefail
          project="aicli-a6-${GITHUB_RUN_ID}"
          docker compose -p "$project" -f tests/aicli-testenv/docker-compose.yml up -d
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:13000/api/status > "$RUNNER_TEMP/aicli-status.json.tmp"; then
              mv "$RUNNER_TEMP/aicli-status.json.tmp" "$RUNNER_TEMP/aicli-status.json"
              break
            fi
            sleep 2
          done
          AICLI_STATUS_FILE="$RUNNER_TEMP/aicli-status.json" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          status = json.loads(Path(os.environ["AICLI_STATUS_FILE"]).read_text())
          assert status.get("success") is True, status
          assert status.get("data", {}).get("version") == "v1.0.0-rc.34", status
          PY
          AICLI_TESTENV_BASE_URL=http://127.0.0.1:13000 \
            AICLI_TESTENV_ADMIN_USERNAME=admin \
            AICLI_TESTENV_ADMIN_PASSWORD=ChangeMe_for_local_tests_123\! \
            AICLI_TESTENV_ALICE_PASSWORD=ChangeMe_for_local_tests_123\! \
            python3 tests/aicli-testenv/seed.py
          AICLI_TESTENV_BASE_URL=http://127.0.0.1:13000 \
            AICLI_TESTENV_ADMIN_USERNAME=admin \
            AICLI_TESTENV_ADMIN_PASSWORD=ChangeMe_for_local_tests_123\! \
            AICLI_TESTENV_ALICE_PASSWORD=ChangeMe_for_local_tests_123\! \
            python3 tests/aicli-testenv/seed.py
          printf 'A6-01: PASS\n' | tee "$RUNNER_TEMP/aicli-evidence/A6-01.txt"

      - name: A6-01 sanitized startup logs and container start times
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          compose = ["docker", "compose", "-p", "aicli-a6-" + os.environ["GITHUB_RUN_ID"],
                     "-f", "tests/aicli-testenv/docker-compose.yml"]

          def redact(text):
              text = re.sub(r"(?i)\bsk-[^\s\"'<>;,]+", "[REDACTED]", text)
              text = re.sub(r"(?i)\bBearer\s+[^\s\"'<>;,]+", "[REDACTED]", text)
              text = re.sub(
                  r"(?i)([\"']?(?:access[_-]?token|refresh[_-]?token|proof[_-]?token|"
                  r"authorization|password|api[_-]?key|secret|token|key)[\"']?\s*[:=]\s*)"
                  r"(?:\"[^\"]*\"|'[^']*'|[^\s,;}]+)",
                  r"\1[REDACTED]", text,
              )
              # Also hide unlabelled opaque credentials; startup timestamps and
              # readiness messages remain readable. Raw output never hits disk.
              return re.sub(r"[A-Za-z0-9_+/=-]{20,}", "[REDACTED]", text)

          canary = "opaque" * 6
          for sample in ("sk-" + canary, "Bearer " + canary,
                         '"access_token":"' + canary + '"'):
              assert canary not in redact(sample), "startup log redaction failed"

          def capture(command):
              return subprocess.run(command, stdout=subprocess.PIPE,
                                    stderr=subprocess.STDOUT, text=True)

          logs = capture(compose + ["logs", "--timestamps", "mysql", "new-api"])
          print(redact(logs.stdout), flush=True)
          print("A6-01 startup connection_refused_count=" +
                str(logs.stdout.lower().count("connection refused")), flush=True)
          results = [logs.returncode]
          for service in ("mysql", "new-api"):
              containers = capture(compose + ["ps", "--all", "--quiet", service])
              results.append(containers.returncode)
              ids = containers.stdout.split()
              if containers.returncode != 0 or not ids:
                  print("A6-01 StartedAt unavailable for " + service, flush=True)
                  results.append(1)
                  continue
              inspected = capture(["docker", "inspect", "--format",
                                   "{{.State.StartedAt}}", *ids])
              print("A6-01 " + service + " StartedAt=" + redact(inspected.stdout.strip()), flush=True)
              results.append(inspected.returncode)
          raise SystemExit(1 if any(results) else 0)
          PY

      - name: A6-01 remove the isolated compose environment
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          project="aicli-a6-${GITHUB_RUN_ID}"
          docker compose -p "$project" -f tests/aicli-testenv/docker-compose.yml down -v --remove-orphans

      - name: A6-02 mock upstream protocol and injection tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user pytest
          PYTHONPATH=tests/aicli-testenv python3 -m pytest -q tests/aicli-testenv/tests/test_mock_upstream.py 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/A6-02.txt"

      - name: A6-03 managed token routing integration test
        shell: bash
        run: |
          set -euo pipefail
          project="aicli-a603-${GITHUB_RUN_ID}"
          cleanup() {
            if [ "${A603_RESULT:-1}" -ne 0 ]; then
              docker compose -p "$project" -f tests/aicli-testenv/docker-compose.yml ps || true
              docker compose -p "$project" -f tests/aicli-testenv/docker-compose.yml logs --no-color new-api mock-upstream || true
            fi
            docker compose -p "$project" -f tests/aicli-testenv/docker-compose.yml down -v --remove-orphans || true
          }
          trap cleanup EXIT
          A603_RESULT=1
          docker compose -p "$project" -f tests/aicli-testenv/docker-compose.yml up -d
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:13000/api/status > /dev/null; then break; fi
            sleep 2
          done
          AICLI_TESTENV_BASE_URL=http://127.0.0.1:13000 \
            AICLI_TESTENV_ADMIN_USERNAME=admin \
            AICLI_TESTENV_ADMIN_PASSWORD=ChangeMe_for_local_tests_123\! \
            AICLI_TESTENV_ALICE_PASSWORD=ChangeMe_for_local_tests_123\! \
            python3 tests/aicli-testenv/seed.py
          docker compose -p "$project" -f tests/aicli-testenv/docker-compose.yml restart new-api
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:13000/api/status > /dev/null; then break; fi
            sleep 2
          done
          AICLI_TESTENV_BASE_URL=http://127.0.0.1:13000 \
            AICLI_TESTENV_ALICE_PASSWORD=ChangeMe_for_local_tests_123\! \
            PYTHONPATH=tests/aicli-testenv python3 -m pytest -q -s --tb=short tests/aicli-testenv/tests/test_token_routing.py 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/A6-03.txt"
          A603_RESULT=0

      - name: A6-04 system access token boundaries in local disposable users
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/aicli-testenv/tests -p 'test_access_token_safety.py' -v 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/A6-04-safety.txt"
          project="aicli-a604-${GITHUB_RUN_ID}"
          cleanup() {
            docker compose -p "$project" -f tests/aicli-testenv/docker-compose.yml down -v --remove-orphans
          }
          trap cleanup EXIT
          docker compose -p "$project" -f tests/aicli-testenv/docker-compose.yml up -d
          AICLI_TESTENV_BASE_URL=http://127.0.0.1:13000 \
            AICLI_TESTENV_ADMIN_USERNAME=admin \
            AICLI_TESTENV_ADMIN_PASSWORD=ChangeMe_for_local_tests_123\! \
            AICLI_TESTENV_ALICE_PASSWORD=ChangeMe_for_local_tests_123\! \
            python3 tests/aicli-testenv/seed.py
          docker compose -p "$project" -f tests/aicli-testenv/docker-compose.yml restart new-api
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:13000/api/status > /dev/null; then break; fi
            sleep 2
          done
          AICLI_TESTENV_BASE_URL=http://127.0.0.1:13000 \
            AICLI_TESTENV_ADMIN_USERNAME=admin \
            AICLI_TESTENV_ADMIN_PASSWORD=ChangeMe_for_local_tests_123\! \
            python3 -m pytest -q -s --tb=short tests/aicli-testenv/tests/test_access_token.py 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/A6-04.txt"

      - name: A6-05 affinity rules and streaming retry observations
        shell: bash
        run: |
          set -euo pipefail
          project="aicli-a605-${GITHUB_RUN_ID}"
          cleanup() {
            docker compose -p "$project" -f tests/aicli-testenv/docker-compose.yml down -v --remove-orphans
          }
          trap cleanup EXIT
          docker compose -p "$project" -f tests/aicli-testenv/docker-compose.yml up -d
          AICLI_TESTENV_BASE_URL=http://127.0.0.1:13000 \
            AICLI_TESTENV_ADMIN_USERNAME=admin \
            AICLI_TESTENV_ADMIN_PASSWORD=ChangeMe_for_local_tests_123\! \
            AICLI_TESTENV_ALICE_PASSWORD=ChangeMe_for_local_tests_123\! \
            python3 tests/aicli-testenv/seed.py
          AICLI_TESTENV_BASE_URL=http://127.0.0.1:13000 \
            AICLI_TESTENV_PROJECT="$project" \
            PYTHONPATH=tests/aicli-testenv python3 -m pytest -q -s --tb=short tests/aicli-testenv/tests/test_affinity_retry.py 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/A6-05.txt"

      - name: A3-01 run the baseline acceptance commands
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/aicli-check.sh 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/A3-01.txt"

      - name: B-01 verify the configuration directory identity
        shell: bash
        run: |
          set -euo pipefail
          if grep -rn '"\.cc-switch"' src-tauri/src; then
            echo 'B-01: legacy configuration directory literal remains'
            exit 1
          fi
          cargo nextest run --manifest-path src-tauri/Cargo.toml --test config_identity 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/B-01.txt"

      - name: B-02 verify the proxy port migration
        shell: bash
        run: |
          set -euo pipefail
          if grep -rn 15721 src-tauri/src src; then
            echo 'B-02: legacy proxy port reference remains'
            exit 1
          fi
          test "$(grep -R -n -o '15821' src-tauri/src src | wc -l)" -gt 0
          cargo nextest run --manifest-path src-tauri/Cargo.toml claude_desktop_aicli_write_and_cleanup_preserve_legacy_profile 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/B-02-desktop.txt"
          printf 'B-02: PASS\n' | tee "$RUNNER_TEMP/aicli-evidence/B-02.txt"

      - name: B-03 verify product identity metadata
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path src-tauri/Cargo.toml 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/B-03-cargo.txt"
          pnpm typecheck 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/B-03-typecheck.txt"
          expected=$(cat <<'EOF'
          src-tauri/tauri.conf.json:67:        "https://dl.ccswitch.io/latest.json",
          EOF
          )
          actual=$(grep -n -E 'ccswitch|CC Switch' src-tauri/tauri.conf.json src-tauri/Cargo.toml package.json || true)
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
          printf '%s\n' "$actual" | tee "$RUNNER_TEMP/aicli-evidence/B-03-scan.txt"
          test "$(grep -n 'AICLI Client' src-tauri/tauri.conf.json src-tauri/tauri.windows.conf.json | wc -l)" -gt 0
          test "$(grep -n 'com.aicliapi.com' src-tauri/tauri.conf.json | wc -l)" -gt 0
          test "$(grep -n '0.1.0' src-tauri/tauri.conf.json src-tauri/Cargo.toml package.json | wc -l)" -ge 3
          printf 'B-03: PASS\n' | tee "$RUNNER_TEMP/aicli-evidence/B-03.txt"

      - name: B-04 verify deep links and generated Linux handler
        shell: bash
        run: |
          set -euo pipefail
          cargo nextest run --manifest-path src-tauri/Cargo.toml deeplink 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/B-04-tests.txt"
          sudo apt-get install -y --no-install-recommends xvfb xauth xdg-utils desktop-file-utils
          cargo build --manifest-path src-tauri/Cargo.toml --example aicli-deeplink-probe
          mkdir -p "$RUNNER_TEMP/aicli-deeplink-probe"
          cp src-tauri/target/debug/examples/aicli-deeplink-probe "$RUNNER_TEMP/aicli-deeplink-probe/aicli-client"
          xvfb-run -a "$RUNNER_TEMP/aicli-deeplink-probe/aicli-client" 2>&1 | tee "$RUNNER_TEMP/aicli-evidence/B-04-handler.txt"
          printf 'B-04: PASS\n' | tee "$RUNNER_TEMP/aicli-evidence/B-04.txt"

      - name: Save acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aicli-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/aicli-evidence/
          if-no-files-found: warn
          retention-days: 7
